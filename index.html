<!DOCTYPE html>
<!-- Timetable country selector removed: 2026-10-10 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A3A34">
<meta name="application-name" content="Al-Ahruf Academy">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Al-Ahruf Academy">
<link rel="manifest" href="./manifest.json">
<link id="academy-favicon" rel="icon" type="image/svg+xml" href="./app-icon.svg">
<link rel="apple-touch-icon" href="./app-icon.svg">
<title>Al-Ahruf International Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran:wght@400;700&family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#F6F1E4;--card:#FFFDF8;--ink:#12302B;--mute:#5E756E;--line:#E3DAC4;--pri:#0B4A42;--pri2:#137063;--gold:#C99A3D;--soft:#EEE6D2;--bad:#B3392E;--ok:#1E7A55;--onpri:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081814;--card:#0F2620;--ink:#E6F1ED;--mute:#93AFA6;--line:#21423A;--pri:#1C8A78;--pri2:#2AA48F;--gold:#E0B55B;--soft:#143229;--bad:#F07A6E;--ok:#58C79A}}
:root[data-theme="dark"]{--bg:#081814;--card:#0F2620;--ink:#E6F1ED;--mute:#93AFA6;--line:#21423A;--pri:#1C8A78;--pri2:#2AA48F;--gold:#E0B55B;--soft:#143229;--bad:#F07A6E;--ok:#58C79A}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
body{overscroll-behavior-y:auto}
.card,[style*="overflow-y:auto"],[style*="overflow:auto"]{-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;line-height:1.15}
a{color:inherit}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:10px 20px;background:#0A3A34;color:#fff;border-bottom:3px solid var(--gold)}
.bar img{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold)}
.bar b{font:700 1.25rem 'Cormorant Garamond',serif;letter-spacing:.3px}
.bar .sp{flex:1}.bar small{opacity:.75;display:block;font-size:.72rem}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:5px 12px;font:600 .78rem Figtree;cursor:pointer}
.bar .chip[onclick="theme()"]{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 14px;border:1px solid rgba(255,255,255,.48);border-radius:999px;background:rgba(255,255,255,.14);font-weight:700;box-shadow:0 2px 8px #00000018;transition:background .2s,transform .2s}.bar .chip[onclick="theme()"]::before{content:"☾";font-size:1.2rem;line-height:1}.bar .chip[onclick="theme()"]:hover{background:rgba(255,255,255,.24)}.bar .chip[onclick="theme()"]:active{transform:scale(.97)}:root[data-theme="dark"] .bar .chip[onclick="theme()"]::before{content:"☀"}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]) .bar .chip[onclick="theme()"]::before{content:"☀"}}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:var(--onpri);border:0;border-radius:9px;padding:10px 16px;font:700 .88rem Figtree;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pri2)}.btn.gold{background:var(--gold);color:#241a05}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.red{background:var(--bad);color:#fff}.btn.sm{padding:5px 10px;font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-weight:600;font-size:.82rem;margin:12px 0 5px;color:var(--mute)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:stretch}
.brand{background:linear-gradient(160deg,#0A3A34,#0E5A4E);color:#fff;border-radius:18px;padding:34px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--gold)}
.brand img{width:150px;height:150px;border-radius:50%;border:2px solid var(--gold);margin-bottom:18px}
.brand h1{font-size:2.5rem}.brand h1 em{font-style:normal;color:var(--gold)}
.brand p{opacity:.85;max-width:44ch}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--soft);padding:4px;border-radius:11px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:9px;border-radius:8px;font:700 .86rem Figtree;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.12)}
/* Ensure login role selector remains visible and correctly rendered */
#rt{display:flex!important;visibility:visible!important;opacity:1!important}
#rt button{display:block!important;visibility:visible!important;opacity:1!important}

.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(18,48,43,.06)}
.nav button{border:1px solid transparent;background:transparent;color:var(--mute);padding:9px 13px;border-radius:9px;font:700 .84rem Figtree;cursor:pointer;transition:.18s}
.nav button:hover{background:var(--soft);color:var(--pri)}
.nav button.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 7px rgba(11,74,66,.2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stats .card b{font:700 2rem 'Cormorant Garamond',serif;color:var(--pri);display:block}.stats span{color:var(--mute);font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.end{justify-content:flex-end;margin-top:16px}.between{justify-content:space-between}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:.78rem;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}
.badge{padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--soft)}.paid,.present{color:var(--ok)}.pending,.late{color:var(--gold)}.overdue,.absent{color:var(--bad)}
.bar2{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;min-width:80px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold))}
.tag{display:inline-block;background:var(--soft);border-radius:99px;padding:2px 10px;font-size:.76rem;margin:2px}
.code{font:700 1.7rem 'Cormorant Garamond',serif;letter-spacing:4px;color:var(--pri)}
.live{width:10px;height:10px;border-radius:50%;background:#e5484d;display:inline-block;margin-right:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:22px;width:min(520px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;display:none;z-index:99}
.mute{color:var(--mute);font-size:.85rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}.brand h1{font-size:2rem}.bar small{display:none}}

/* Premium Al-Ahruf login styling */
body:has(.hero) .bar{display:none}
body:has(.hero){background:#fbfaf6}
body:has(.hero) .wrap{max-width:none;padding:0}
body:has(.hero) .hero{min-height:100vh;grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);gap:0;background:#fbfaf6}
body:has(.hero) .brand{position:relative;overflow:hidden;border:0;border-radius:0;padding:clamp(38px,6vw,86px);justify-content:center;min-height:100vh;background:radial-gradient(circle at 80% 18%,rgba(201,154,61,.28),transparent 24%),linear-gradient(145deg,#063c34 0%,#0b6659 58%,#0a493f 100%)}
body:has(.hero) .brand:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 28px,rgba(255,255,255,.025) 29px 30px);pointer-events:none}
body:has(.hero) .brand:after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;right:-200px;bottom:-250px;border:1px solid rgba(201,154,61,.35);box-shadow:0 0 0 34px rgba(201,154,61,.05),0 0 0 68px rgba(201,154,61,.035);pointer-events:none}
body:has(.hero) .brand>*{position:relative;z-index:1}
body:has(.hero) .brand img{width:112px;height:112px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.18);margin-bottom:22px}
body:has(.hero) .brand h1{font-size:clamp(3rem,5.2vw,5.2rem);letter-spacing:-1px;max-width:760px}
body:has(.hero) .brand h1 em{display:block;color:#d9aa4d;font-style:italic}
body:has(.hero) .brand p{font-size:clamp(1rem,1.5vw,1.2rem);line-height:1.7;max-width:620px;color:rgba(255,255,255,.86);margin:22px 0 28px}
body:has(.hero) .brand .tabs{background:transparent;padding:0;margin:0;gap:12px}
body:has(.hero) .brand .tabs button{flex:initial;padding:12px 24px;border:1px solid rgba(255,255,255,.7);border-radius:999px;color:#fff;background:transparent}
body:has(.hero) .brand .tabs button:first-child{background:var(--gold);border-color:var(--gold);color:#241a05}
body:has(.hero) .hero>.card{align-self:center;margin:36px;max-width:540px;width:calc(100% - 72px);justify-self:center;background:#fff;border:1px solid #e9e2d4;border-radius:28px;padding:34px;box-shadow:0 22px 70px rgba(20,48,43,.11)}
body:has(.hero) .hero>.card .tabs{display:flex;gap:3px;border:1px solid #d8e1dd;background:#f3f7f5;padding:4px;border-radius:999px;margin-bottom:24px}
body:has(.hero) .hero>.card .tabs button{border:0;background:transparent;color:var(--mute);padding:12px 8px;border-radius:999px;font:700 .9rem Figtree;cursor:pointer}
body:has(.hero) .hero>.card .tabs button.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(11,74,66,.2)}
body:has(.hero) .hero>.card label{font-size:.78rem}
body:has(.hero) .hero>.card input{padding:14px 15px;border-radius:13px;background:#fff;color:#000;border-color:#d8e2de}
body:has(.hero) .hero>.card input::placeholder{color:#555;opacity:1}
body:has(.hero) .hero>.card input:focus{color:#000;background:#fff}
body:has(.hero) .hero>.card input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(19,112,99,.1)}
body:has(.hero) .hero>.card form .btn{width:100%;margin-top:20px;padding:14px;border-radius:13px}
body:has(.hero) .hero>.card .badge{background:transparent;padding:0}
@media(max-width:900px){
 body:has(.hero) .hero{grid-template-columns:1fr}
 body:has(.hero) .brand{min-height:auto;padding:44px 24px 38px}
 body:has(.hero) .brand h1{font-size:3.3rem}
 body:has(.hero) .hero>.card{margin:0;padding:28px 20px;width:100%;max-width:620px;border-radius:0;box-shadow:none}
}
@media(max-width:520px){
 body:has(.hero) .brand{padding:30px 20px}
 body:has(.hero) .brand img{width:82px;height:82px}
 body:has(.hero) .brand h1{font-size:2.55rem}
 body:has(.hero) .brand .tabs{flex-wrap:wrap}
 body:has(.hero) .brand .tabs button{padding:10px 18px}
 body:has(.hero) .hero>.card{padding:22px 16px}
}

.surah-en{font-weight:700}.surah-ar{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;font-weight:700;direction:rtl}.surah-dash{color:var(--mute)}.surah-list-vertical{display:flex;flex-direction:column;gap:8px}.surah-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.surah-num{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--pri);font-weight:700}.surah-item .surah-name{display:flex;align-items:center;gap:6px;flex:1;justify-content:space-between}@media(max-width:560px){.surah-item .surah-name{flex-wrap:wrap;justify-content:flex-start}.surah-ar{font-size:1.12em}}

/* Multilingual interface */
.lang-switch{display:flex;align-items:center;gap:6px;position:fixed;top:62px;left:50%;right:auto;transform:translateX(-50%);z-index:120}
.logout-btn{margin-left:8px;border:1px solid rgba(255,255,255,.45);font-weight:700}.lang-switch select{width:auto;min-width:132px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(10,58,52,.92);color:#fff;font:600 .78rem Figtree;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.12)}
body.rtl{direction:rtl}
body.rtl .bar,.rtl .row,.rtl .nav,.rtl .tabs{direction:rtl}
body.rtl th{text-align:right}
body.rtl input,body.rtl textarea,body.rtl select{text-align:right}
body.rtl .hero>.card{text-align:right}
body.rtl .brand{text-align:right}
body.rtl .surah-ar{direction:rtl}
body.rtl .lang-switch{right:auto;left:50%;transform:translateX(-50%)}
@media(max-width:520px){.lang-switch{top:58px;left:50%;right:auto;transform:translateX(-50%)}.lang-switch select{min-width:104px}}

/* Password field readability on phones */
body:has(.hero) .hero>.card input[type="password"]{color:#000!important;background:#fff!important;-webkit-text-fill-color:#000!important;caret-color:#000!important;letter-spacing:.04em}
body:has(.hero) .hero>.card input[type="password"]::placeholder{color:#555!important;opacity:1}
@media(max-width:700px){body:has(.hero) .hero>.card input[type="password"]{font-size:16px!important;min-height:48px;padding:14px 15px}}
/* Mobile-first readability and touch layout */
@media(max-width:700px){
  body{font-size:15px;overflow-x:hidden}
  .bar{padding:10px 12px 12px;gap:9px;flex-wrap:wrap;min-height:64px}
  .bar img{width:38px;height:38px;flex:0 0 38px}
  .bar>div:not(.sp){min-width:0}
  .bar b{font-size:1.05rem;line-height:1.15;display:block;white-space:normal}
  .bar small{font-size:.68rem;line-height:1.2}
  .bar .sp{display:none}
  .bar #who{order:5;flex:1 1 100%;text-align:center;font-size:.78rem;margin-top:2px}
  .bar .chip{font-size:.74rem;padding:7px 10px}
  .bar .chip[onclick="theme()"]{margin-left:auto}
  .logout-btn{margin-left:0!important}
  .lang-switch{position:fixed;top:8px;left:auto;right:10px;transform:none;z-index:200}
  .lang-switch select{min-width:96px;padding:7px 9px;font-size:.72rem}
  .wrap{padding:14px 10px 28px}
  .card{padding:14px;border-radius:12px}
  .row{gap:8px}
  .row>*{max-width:100%}
  .nav{gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px;-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto;padding:8px 11px;font-size:.76rem;white-space:nowrap}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stats .card{padding:12px}
  .stats .card b{font-size:1.55rem}
  .grid2{grid-template-columns:1fr;gap:10px}
  .tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:520px;font-size:.82rem}
  th,td{padding:8px}
  .btn{min-height:42px;padding:9px 12px}
  .btn.sm{min-height:36px}
  dialog{width:calc(100vw - 20px);padding:16px;max-height:88vh}
  input,select,textarea{font-size:16px;min-height:44px}
  .surah-item{padding:10px;gap:8px}
  .surah-item .surah-name{min-width:0}
  .code{font-size:1.35rem;letter-spacing:2px}
}
@media(max-width:420px){
  .bar{padding-right:8px;padding-left:8px}
  .bar img{width:34px;height:34px;flex-basis:34px}
  .bar b{font-size:.95rem}
  .bar .chip{padding:6px 8px;font-size:.7rem}
  .lang-switch{right:7px}
  .lang-switch select{min-width:88px;padding:6px 7px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .card b{font-size:1.35rem}
  .end{justify-content:stretch}
  .end .btn{width:100%}
}

/* Keep the login screen clear and comfortable on phones */
@media(max-width:700px){
  body:has(.hero) .hero{min-height:100svh}
  body:has(.hero) .brand{padding:28px 18px 24px;min-height:auto}
  body:has(.hero) .brand img{width:72px;height:72px;margin-bottom:14px}
  body:has(.hero) .brand h1{font-size:clamp(2.15rem,10vw,3rem);line-height:1.05}
  body:has(.hero) .brand p{font-size:.92rem;line-height:1.5;margin:14px 0 18px}
  body:has(.hero) .brand .tabs{gap:7px}
  body:has(.hero) .brand .tabs button{padding:9px 13px;font-size:.78rem}
  body:has(.hero) .hero>.card{padding:20px 16px;width:100%;max-width:none}
  body:has(.hero) .hero>.card .tabs{margin-bottom:18px}
  body:has(.hero) .hero>.card .tabs button{padding:11px 5px;font-size:.8rem}
  body:has(.hero) .hero>.card input{font-size:16px;min-height:48px}
  body:has(.hero) .hero>.card form .btn{min-height:48px}
}

/* Always-visible Admin login */
#rt button[data-r="admin"]{display:block!important;background:var(--gold)!important;color:#241a05!important;border:1px solid var(--gold)!important;font-weight:800!important}

/* Arabic academy name beside the English name */
.arabic-name{display:inline-block;margin-left:10px;font-family:Arial,sans-serif;font-size:.9em;font-weight:700;letter-spacing:0;white-space:nowrap;direction:rtl}

/* Elegant welcome curtain animation after successful sign-in */
#ahruf-curtain-intro{position:fixed;inset:0;z-index:99999;pointer-events:none;overflow:hidden;display:flex;background:transparent;animation:ahruf-curtain-fade 1.75s ease forwards}
#ahruf-curtain-intro .ahruf-curtain{position:absolute;top:0;bottom:0;width:51%;background:linear-gradient(100deg,#0a241b 0%,#164a36 42%,#0c3024 82%,#071d16 100%);box-shadow:inset -10px 0 24px #0003,inset 0 0 0 2px #c9a85c55}
#ahruf-curtain-intro .ahruf-curtain.left{left:0;border-right:3px solid #c9a85c;animation:ahruf-curtain-left 1.35s cubic-bezier(.65,0,.25,1) forwards}
#ahruf-curtain-intro .ahruf-curtain.right{right:0;transform:scaleX(-1);border-right:3px solid #c9a85c;animation:ahruf-curtain-right 1.35s cubic-bezier(.65,0,.25,1) forwards}
#ahruf-curtain-intro .ahruf-curtain:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8%,#d7c08b0d 9%,transparent 12% 18%);border-bottom:8px solid #c9a85c}
#ahruf-curtain-intro .ahruf-curtain.left:before,#ahruf-curtain-intro .ahruf-curtain.right:before{content:"";position:absolute;top:0;bottom:0;width:16px;right:12%;background:linear-gradient(90deg,#c9a85c99,#f1dfaa,#a27b37);opacity:.65}
@keyframes ahruf-curtain-left{to{transform:translateX(-102%)}}
@keyframes ahruf-curtain-right{to{transform:translateX(102%) scaleX(-1)}}
@keyframes ahruf-curtain-fade{0%,82%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#ahruf-curtain-intro,#ahruf-curtain-intro .ahruf-curtain.left,#ahruf-curtain-intro .ahruf-curtain.right{animation-duration:.01ms}}


/* Quran reader */
.quran-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin:12px 0}
.quran-tools label{display:block;font-weight:700;margin-bottom:6px}
.quran-tools select{width:100%;min-width:0}
.quran-actions{display:flex;gap:8px;flex-wrap:wrap}
.quran-reading{margin-top:16px;border:1px solid #d5c9ad;border-radius:14px;background:#fffdf5;color:#25251f;padding:clamp(12px,2vw,24px)}.quran-reading{touch-action:pan-y;overscroll-behavior-x:contain;cursor:grab}.quran-reading.quran-swiping{cursor:grabbing;user-select:none}

/* Desktop dashboard width: use 96% of the available viewport.
   Keep login pages and existing feature layouts unchanged. */
@media (min-width: 901px) {
  body:not(:has(.hero)) .wrap {
    width: 96%;
    max-width: none;
    margin-left: auto;
    margin-right: auto;
    padding-left: 16px;
    padding-right: 16px;
  }
  body:not(:has(.hero)) .wrap > .card,
  body:not(:has(.hero)) .wrap > .nav,
  body:not(:has(.hero)) .wrap > .stats,
  body:not(:has(.hero)) .wrap > .tw {
    min-width: 0;
  }
}

@media (min-width: 701px) and (max-width: 900px) {
  body:not(:has(.hero)) .wrap {
    width: 98%;
    max-width: none;
    margin-left: auto;
    margin-right: auto;
    padding: 18px 12px 32px;
  }
}

  body:not(:has(.hero)) .wrap {
    width: 100%;
    max-width: none;
    margin-left: auto;
    margin-right: auto;
  }
}

<script>
const AHRUF_CFG=window.AHRUF_SUPABASE||{};
const SUPABASE_READY=!!(window.supabase&&typeof window.supabase.createClient==='function');
let sb=null;
let ONLINE=false;
let SUPABASE_ERROR='';
try{
  if(SUPABASE_READY&&AHRUF_CFG.url&&AHRUF_CFG.key&&AHRUF_CFG.url.indexOf('YOUR_')<0&&AHRUF_CFG.key.indexOf('YOUR_')<0){
    sb=window.supabase.createClient(AHRUF_CFG.url,AHRUF_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    ONLINE=!!sb;
  }
}catch(e){
  console.error('Supabase client could not start:',e);
  SUPABASE_ERROR=e?.message||String(e);
  sb=null;
  ONLINE=false;
}
let onlineBusy=false;
const API_BASE=ONLINE?AHRUF_CFG.url.replace(/\/$/,'')+'/functions/v1/academy-api':'';
async function onlineApi(action,payload={}){
  if(!ONLINE||!sb) throw new Error('Online database is not configured yet.');

  const body={action,...payload};

  async function currentSession(forceRefresh=false){
    let {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError) console.warn('Could not read academy session:',sessionError.message);
    const expiresAt=Number(session?.expires_at||0);
    const shouldRefresh=forceRefresh||!session?.access_token||(expiresAt>0&&expiresAt*1000<=Date.now()+60000);
    if(shouldRefresh){
      if(!session?.refresh_token){
        console.warn('Academy session refresh unavailable: no refresh token.');
        return null;
      }
      const refreshed=await sb.auth.refreshSession({refresh_token:session.refresh_token});
      if(refreshed?.data?.session?.access_token){
        session=refreshed.data.session;
      }else{
        console.warn('Academy session refresh failed:',refreshed?.error?.message||'No refreshed session returned.');
        // Never continue sending a stale access token after a failed refresh.
        return null;
      }
    }
    return session||null;
  }

  async function request(accessToken){
    const headers={'Content-Type':'application/json','apikey':AHRUF_CFG.key};
    if(action!=='login')headers.Authorization='Bearer '+accessToken;
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),15000);
    try{
      const res=await fetch(API_BASE,{method:'POST',headers,body:JSON.stringify(body),signal:controller.signal});
      const data=await res.json().catch(()=>({}));
      return {res,data};
    }catch(e){
      if(e?.name==='AbortError')throw new Error('The academy server did not respond. Please try again.');
      throw e;
    }finally{
      clearTimeout(timeout);
    }
  }

  let session=null;
  if(action!=='login'){
    session=await currentSession(false);
    if(!session?.access_token){
      throw new Error('Your login session has expired. Please log out and sign in again.');
    }
  }

  let result=await request(session?.access_token||'');
  let {res,data}=result;

  // A token can look present in browser storage but already be invalid on the server.
  // Refresh it and retry once when the API reports an authentication failure.
  if(action!=='login'&&(data?.error==='Not authenticated.'||res.status===401||res.status===403)){
    session=await currentSession(true);
    if(!session?.access_token){
      throw new Error('Your login session has expired. Please log out and sign in again.');
    }
    result=await request(session.access_token);
    res=result.res;
    data=result.data;
  }

  if(!res.ok||data?.error){
    if(action!=='login'&&data?.error==='Not authenticated.'){
      throw new Error('Your login session is no longer valid. Please log out and sign in again.');
    }
    throw new Error(data?.error||('API request failed: '+res.status));
  }

  // Install the server-issued session after a successful login.
  if(action==='login'&&data.session?.access_token&&data.session?.refresh_token){
    const {error}=await sb.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });
    if(error)throw error;
  }
  return data;
}

}

/* Translate dynamically inserted text and attributes too, including async responses and toasts. */
function installGlobalLanguageObserver(){
 if(window.__ahrufLanguageObserverInstalled)return;
 window.__ahrufLanguageObserverInstalled=true;
 const translateNode=node=>{
  if(!node)return;
  const dict=I18N[currentLang]||{};
  if(node.nodeType===Node.TEXT_NODE){
   const p=node.parentElement;
   if(!p||p.closest('script,style,noscript,textarea,[contenteditable="true"]'))return;
   if(!node.hasAttribute?.('data-ahruf-original'))node.__ahrufOriginal=node.nodeValue;
   const original=node.__ahrufOriginal??node.nodeValue;
   const key=original.trim();
   if(key&&dict[key])node.nodeValue=original.replace(key,dict[key]);
   else if(currentLang==='en')node.nodeValue=original;
  }else if(node.nodeType===Node.ELEMENT_NODE){
   ['placeholder','title','aria-label'].forEach(attr=>{
    const key=node.getAttribute('data-ahruf-'+attr)||node.getAttribute(attr);
    if(key){if(!node.hasAttribute('data-ahruf-'+attr))node.setAttribute('data-ahruf-'+attr,key);const original=node.getAttribute('data-ahruf-'+attr);if(dict[original])node.setAttribute(attr,dict[original]);else if(currentLang==='en')node.setAttribute(attr,original)}
   });
   node.childNodes.forEach(translateNode);
  }
 };
 const observer=new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(translateNode)));
 observer.observe(document.body,{childList:true,subtree:true});
 window.__ahrufLanguageObserver=observer;
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatMessageBody(value){
 const linked=esc(value).replace(/https?:\/\/[^\s<]+/gi,raw=>{const match=raw.match(/[.,!?;:]+$/);const url=match?raw.slice(0,-match[0].length):raw;const tail=match?match[0]:'';return '<a href="'+url+'" target="_blank" rel="noopener noreferrer" style="color:var(--link,var(--gold));text-decoration:underline;overflow-wrap:anywhere">'+url+'</a>'+tail;});
 return linked.split(/(<a\b[^>]*>[\s\S]*?<\/a>)/gi).map(part=>{
  if(/^<a\b/i.test(part))return part;
  return part.replace(/(^|[^\w])((?:\+?\d)[\d\s().-]{5,}\d)(?!\w)/g,(whole,prefix,number)=>{
   const digits=number.replace(/\D/g,'');
   if(digits.length<7||digits.length>15||/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(number.trim()))return whole;
   const dial=number.replace(/[^\d+]/g,'').replace(/(?!^)\+/g,'');
   return prefix+'<a href="tel:'+dial+'" style="color:var(--link,var(--gold));text-decoration:underline;white-space:nowrap" aria-label="Call '+number.trim()+'">'+number+'</a>';
  });

function applyArabicIndicDigits(root=document.body){
 if(currentLang!=='ar')return;
 const digits={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
 const convert=value=>String(value).replace(/[0-9]/g,d=>digits[d]);
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let node;
 while((node=walker.nextNode())){
  const parent=node.parentElement;
  if(!parent||parent.closest('script,style,noscript,textarea,[contenteditable="true"]'))continue;
  if(/[0-9]/.test(node.nodeValue))node.nodeValue=convert(node.nodeValue);
 }
 root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
  ['placeholder','title','aria-label'].forEach(attr=>{
   const value=el.getAttribute(attr);
   if(value&&/[0-9]/.test(value))el.setAttribute(attr,convert(value));
  });
 });
}

   document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(link=>{link.href=logo.src;});

 }catch(e){}
}

 function syncAppUnreadBadge(){

     if(ctx){

function currentStudent(){
 const sid=String(user.username||user.studentId||user.student_id||user.id||'').trim().toLowerCase();
 const students=Array.isArray(S.students)?S.students:[];
 const byId=students.find(x=>[x.id,x.studentId,x.student_id,x.username,x.userId,x.user_id].some(v=>String(v||'').trim().toLowerCase()===sid));
 if(byId)return byId;
 // Legacy accounts can use an older ID than the student record. Match exact
 // normalized account name first, then phone/email only when the login provides it.
 const normalizeName=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
 if(user.role==='student'){
  const accountName=normalizeName(user.name||user.fullName||user.full_name);
  if(accountName){
   const byName=students.find(x=>normalizeName(x.name)===accountName);
   if(byName)return byName;
  }
  const accountEmail=String(user.email||'').trim().toLowerCase();
  if(accountEmail){
   const byEmail=students.find(x=>String(x.email||'').trim().toLowerCase()===accountEmail);
   if(byEmail)return byEmail;
  }
  const accountPhone=String(user.phone||user.mobile||'').replace(/\D/g,'');
  if(accountPhone.length>=7){
   const byPhone=students.find(x=>String(x.phone||x.mobile||'').replace(/\D/g,'')===accountPhone);
   if(byPhone)return byPhone;
  }
 }
 return user.role==='student'&&students.length===1?students[0]:null;
}
function classmates(){
 if(user.role!=='student')return '<div class="card"><b>Permission denied.</b></div>';
 const sid=String(user.username||user.studentId||user.student_id||user.id||'').trim().toLowerCase();
 const students=Array.isArray(S.students)?S.students:[];
 const me=currentStudent();
 const peers=Array.isArray(S.messagePeers)?S.messagePeers:[];
 const teacherKey=value=>{
  const raw=String(value||'').trim().toLowerCase();
  if(!raw)return '';
  const teacher=(S.teachers||[]).find(t=>String(t.username||'').trim().toLowerCase()===raw||String(t.name||'').trim().toLowerCase()===raw);
  return String(teacher?.username||raw).trim().toLowerCase();
 };
 const fallback=me&&me.teacher?students.filter(x=>
  String(x.id||'').trim().toLowerCase()!==String(me.id||'').trim().toLowerCase()&&
  teacherKey(x.teacher)===teacherKey(me.teacher)
 ): [];
 const list=(peers.length?peers:fallback).filter(p=>String(p.id||'').trim().toLowerCase()!==sid);
 if(!me&&!peers.length)return '<div class="card"><h3>Classmates</h3><p class="mute">Your class list is loading or your teacher has not been assigned yet. Please refresh or contact the administrator.</p></div>';

}
function openClassmateDiscussion(to){

 const peer=String(to||'').trim().toLowerCase();
 if(!peer||peer===me)return;
 const matching=(S.messages||[]).filter(m=>{
  const from=String(m.from||'').trim().toLowerCase(),dest=String(m.to||'').trim().toLowerCase();
  return (from===me&&dest===peer)||(from===peer&&dest===me);
 }).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));

 document.body.classList.add('message-conversation-open');
 render();
}

function updateVoiceRecordingStatus(){const elapsed=Math.max(0,Math.floor((Date.now()-voiceRecordingStartedAt)/1000));const mm=String(Math.floor(elapsed/60)).padStart(2,'0'),ss=String(elapsed%60).padStart(2,'0');document.querySelectorAll('.recordingStatus').forEach(status=>{status.innerHTML='<span class="voice-recording-status"><span class="voice-recording-dot"></span><span>Recording</span><span class="voice-wave" aria-hidden="true">'+Array.from({length:12},()=>'<i></i>').join('')+'</span><span class="voice-recording-time">'+mm+':'+ss+'</span></span>'})}

async function startWhatsAppVoiceNote(event,button){
  if(event){event.preventDefault();event.stopPropagation()}

 if(voicePermissionPending)return;
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){toast('Voice recording is not supported by this browser. Please attach an audio file instead.');return}
 activeVoiceForm=button?.closest('form')||null;voicePermissionPending=true;voiceReleasedWhilePending=false;
 button?.classList.add('voice-recording');if(button){button.innerHTML="<svg viewBox=\"0 0 24 24\" width=\"25\" height=\"25\" aria-hidden=\"true\" focusable=\"false\" style=\"display:block;fill:currentColor\"><rect x=\"6\" y=\"4\" width=\"4\" height=\"16\" rx=\"1\"></rect><rect x=\"14\" y=\"4\" width=\"4\" height=\"16\" rx=\"1\"></rect></svg>";button.title='Pause recording and review';button.setAttribute('aria-label','Pause recording and review')}
 voiceRecordingStartedAt=Date.now();updateVoiceRecordingStatus();if(voiceRecordingTimer)clearInterval(voiceRecordingTimer);voiceRecordingTimer=setInterval(updateVoiceRecordingStatus,250);
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const recorder=new MediaRecorder(stream);activeMessageRecorder=recorder;activeMessageChunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)activeMessageChunks.push(e.data)};
  recorder.onstop=()=>{
   const blob=new Blob(activeMessageChunks,{type:recorder.mimeType||'audio/webm'});
   stream.getTracks().forEach(t=>t.stop());
   document.querySelectorAll('.recordAudioBtn').forEach(b=>{b.classList.remove('voice-recording');b.disabled=false;b.innerHTML="<svg viewBox=\"0 0 24 24\" width=\"25\" height=\"25\" aria-hidden=\"true\" focusable=\"false\" style=\"display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><rect x=\"9\" y=\"2.5\" width=\"6\" height=\"12\" rx=\"3\"></rect><path d=\"M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7\"></path></svg>";b.title='Record voice message';b.setAttribute('aria-label','Record voice message')});
   clearVoiceRecordingIndicator('Preparing voice message…');

   const form=activeVoiceForm;activeVoiceForm=null;

   reader.onload=()=>{recordedAudioAttachment={name:'voice-message.webm',type:blob.type||'audio/webm',size:blob.size,data:reader.result};document.querySelectorAll('.recordingStatus').forEach(status=>{status.innerHTML='<div class="whatsapp-voice-bubble"><span class="whatsapp-voice-icon">🎙</span><div class="whatsapp-voice-content"><div class="whatsapp-voice-waveform" aria-label="Voice waveform" role="img">'+voiceWaveformBars({id:"unsent-voice-preview"})+'<span class="whatsapp-voice-playhead" aria-hidden="true"></span></div><audio controls preload="metadata" src="'+reader.result+'"></audio></div></div><button type="button" class="btn sm voice-cancel-btn" onclick="cancelRecordedVoiceNote()" aria-label="Cancel voice message" title="Cancel voice message">✕ Cancel</button>'});};
   reader.onerror=()=>toast('Could not prepare the voice message. Please try again.');
   reader.readAsDataURL(blob);
  };
  recorder.start();voicePermissionPending=false;
 }catch(e){

  document.querySelectorAll('.recordAudioBtn').forEach(b=>{b.classList.remove('voice-recording');b.innerHTML="<svg viewBox=\"0 0 24 24\" width=\"25\" height=\"25\" aria-hidden=\"true\" focusable=\"false\" style=\"display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><rect x=\"9\" y=\"2.5\" width=\"6\" height=\"12\" rx=\"3\"></rect><path d=\"M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7\"></path></svg>";b.title='Record voice message';b.setAttribute('aria-label','Record voice message')});

function voiceWaveformBars(message){
 const seed=String(message?.id||message?.attachment?.name||'voice');
 let value=2166136261;
 for(let i=0;i<seed.length;i++){value^=seed.charCodeAt(i);value=Math.imul(value,16777619)}
 const bars=[];
 for(let i=0;i<44;i++){
  value^=value<<13;value^=value>>>17;value^=value<<5;
  const random=(value>>>0)/4294967295;
  const envelope=0.35+0.65*Math.pow(Math.sin(Math.PI*(i+1)/45),0.7);
  const height=Math.round(4+random*19*envelope);
  bars.push('<i style="height:'+height+'px"></i>');
 }
 return bars.join('');
}

 const progress=Number.isFinite(duration)&&duration>0?Math.max(0,Math.min(1,current/duration)):0;
 const bars=wave.querySelectorAll("i"),played=Math.floor(progress*bars.length);
 bars.forEach((bar,index)=>bar.classList.toggle("played",index<played));

function ahrufReadImageFile(file){

  if(!file)return resolve(null);
  if(!file.type||!file.type.startsWith('image/'))return reject(new Error('Please choose an image file.'));
  if(file.size>5*1024*1024)return reject(new Error('Please choose an image smaller than 5 MB.'));
  const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read the selected image.'));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Could not open the selected image.'));img.onload=()=>resolve(img);img.src=reader.result;};
  reader.readAsDataURL(file);

async function cropProfilePhotoBeforeApply(file){

  document.body.appendChild(layer);
  const canvas=layer.querySelector('canvas'),ctx=canvas.getContext('2d'),zoom=layer.querySelector('#ahrufCropZoom'),x=layer.querySelector('#ahrufCropX'),y=layer.querySelector('#ahrufCropY'),zv=layer.querySelector('#ahrufCropZoomValue');
  let finished=false,dragging=false,lastPointerX=0,lastPointerY=0;
  canvas.style.touchAction='none';
  canvas.style.cursor='grab';
  function draw(){
   const scale=Math.min(img.naturalWidth,img.naturalHeight)/Number(zoom.value),maxX=Math.max(0,(img.naturalWidth-scale)/2),maxY=Math.max(0,(img.naturalHeight-scale)/2);
   const sx=Math.max(0,Math.min(img.naturalWidth-scale,img.naturalWidth/2+Number(x.value)/100*maxX-scale/2));
   const sy=Math.max(0,Math.min(img.naturalHeight-scale,img.naturalHeight/2+Number(y.value)/100*maxY-scale/2));
   ctx.clearRect(0,0,400,400);ctx.drawImage(img,sx,sy,scale,scale,0,0,400,400);zv.textContent=Number(zoom.value).toFixed(1)+'×';
  }
  function close(value){if(finished)return;finished=true;layer.remove();resolve(value);}
  canvas.addEventListener('pointerdown',e=>{
   if(finished)return;dragging=true;lastPointerX=e.clientX;lastPointerY=e.clientY;
   canvas.style.cursor='grabbing';try{canvas.setPointerCapture(e.pointerId)}catch(_){}
   e.preventDefault();
  });
  canvas.addEventListener('pointermove',e=>{
   if(!dragging||finished)return;
   const rect=canvas.getBoundingClientRect(),scale=Math.min(img.naturalWidth,img.naturalHeight)/Number(zoom.value);
   const maxX=Math.max(0,(img.naturalWidth-scale)/2),maxY=Math.max(0,(img.naturalHeight-scale)/2);
   const dx=(e.clientX-lastPointerX)*400/Math.max(1,rect.width)*scale;
   const dy=(e.clientY-lastPointerY)*400/Math.max(1,rect.height)*scale;
   lastPointerX=e.clientX;lastPointerY=e.clientY;
   if(maxX>0)x.value=String(Math.max(-100,Math.min(100,Number(x.value)-dx/maxX*100)));
   if(maxY>0)y.value=String(Math.max(-100,Math.min(100,Number(y.value)-dy/maxY*100)));
   draw();e.preventDefault();
  });
  function stopDrag(){dragging=false;canvas.style.cursor='grab';}
  canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);canvas.addEventListener('lostpointercapture',stopDrag);
  [zoom,x,y].forEach(el=>el.addEventListener('input',draw));draw();
  layer.querySelector('[data-crop-cancel]').onclick=()=>close(null);
  layer.querySelector('[data-crop-apply]').onclick=()=>close(canvas.toDataURL('image/jpeg',.88));
  layer.addEventListener('click',e=>{if(e.target===layer)close(null);});
  const escHandler=e=>{if(e.key==='Escape'){document.removeEventListener('keydown',escHandler);close(null);}};
  document.addEventListener('keydown',escHandler);
 }).then(result=>result);
}

function generateStudentId(name,phone,existingId){
 const keep=String(existingId||'').trim();
 if(keep)return keep;
 const letters=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase();
 const digits=String(phone||'').replace(/\D/g,'');
 if(letters.length<2||digits.length<2)return '';
 const base=letters[0]+letters[letters.length-1]+'ARF'+digits.slice(-2);
 const used=new Set((S.students||[]).map(x=>String(x.id||'').toUpperCase()));
 if(!used.has(base))return base;
 let n=2;while(used.has(base+'-'+n))n++;return base+'-'+n;
}

  const allowedClasses=(S.timetable||[]).filter(item=>!isTeacher||ownsClass(item));
  const records=[];
  for(const [date,day] of Object.entries(S.att||{})){
   if(selectedDate&&date!==selectedDate)continue;
   for(const [studentKey,entry] of Object.entries(day||{})){
    const student=(S.students||[]).find(st=>[st.id,st.username,st.studentId,st.student_id].some(v=>String(v||'').toLowerCase()===String(studentKey).toLowerCase()));

function timetableHasClassLink(item,link,ids,studentRec=null){

 );

function ahrufStudentClassWaitMessage(item){

 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Dakar',year:'numeric',month:'2-digit',day:'2-digit',weekday:'long',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const get=n=>parts.find(p=>p.type===n)?.value||'';
 const nowDay=get('weekday').toLowerCase(),dayNames=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
 const targetDay=String(item.day).trim().toLowerCase(),targetIndex=dayNames.indexOf(targetDay);

 if(targetIndex<0||![sh,sm].every(Number.isFinite))return '';

 let daysAhead=(targetIndex-dayNames.indexOf(nowDay)+7)%7;
 if(daysAhead===0&&startMinutes<=nowMinutes)return '';
 const nowUtc=Date.UTC(Number(get('year')),Number(get('month'))-1,Number(get('day')),Number(get('hour')),Number(get('minute')),Number(get('second')));
 const startUtc=Date.UTC(Number(get('year')),Number(get('month'))-1,Number(get('day'))+daysAhead,sh,sm,0);
 const remaining=Math.max(0,Math.ceil((startUtc-nowUtc)/60000));
 const d=Math.floor(remaining/1440),h=Math.floor((remaining%1440)/60),m=remaining%60;
 return t('Please wait. Your class will start in')+' '+d+' '+t(d===1?'day':'days')+', '+h+' '+t(h===1?'hour':'hours')+', '+m+' '+t(m===1?'minute':'minutes')+'.';
}

 const room=automatic?'ahruf-class-'+String(timetableId).replace(/[^a-zA-Z0-9_-]/g,'_')+'-'+dateKey:'ahruf-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
 try{
  let result,peers=[];
  if(user.role==='student'){
   result=await onlineApi('authorize_student_class_call',{timetableId:String(timetableId),room});
   if(result?.status!=='allowed'){
    if(result?.code==='CLASS_MISSED')throw new Error(t('You missed the class, so you cannot join right now. Please contact your Oustaz in Messages to arrange a make-up lesson or ask how to catch up.'));
    throw new Error(result?.message||'This class call is not available now.');
   }
   const attendance=await onlineApi('record_class_attendance',{timetableId:String(timetableId)});
   if(!['present','late'].includes(attendance.status))throw new Error(attendance.message||'You are not eligible for this scheduled call.');
   peers=[String(result.teacherUsername||'').trim().toLowerCase()];
  }else{
   result=await onlineApi('authorize_class_call',{timetableId:String(timetableId),studentUsername:String(studentUsername||''),room});
   if(result?.status!=='allowed')throw new Error(result?.message||'This class call is not available now.');
   peers=(result.students||[]).filter(x=>!studentUsername||String(x.username||'').trim().toLowerCase()===String(studentUsername).trim().toLowerCase()).map(x=>String(x.username||'').trim().toLowerCase());
  }
  peers=peers.filter(Boolean);
  if(!peers.length)throw new Error('No eligible participant is available for this scheduled call.');
  await ahrufCreateCall(kind==='audio'?'audio':'video',peers,{room,timetableId:String(timetableId),automaticClass:automatic});
 }catch(e){if(!automatic)ahrufCallToast(e?.message||'Could not start the scheduled class call.')}

function ahrufStartTeacherScheduleMonitor(){
 if(window._ahrufTeacherScheduleTimer)return;
 const check=async()=>{
  if(!user||user.role!=='teacher'||ahrufActiveCall)return;
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Dakar',weekday:'long',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),get=n=>parts.find(p=>p.type===n)?.value||'';
  const day=get('weekday').toLowerCase(),minutes=Number(get('hour'))*60+Number(get('minute'));
  const schedule=(S.timetable||[]).filter(item=>[user.username,user.id,user.name].some(v=>String(item.teacher||'').trim().toLowerCase()===String(v||'').trim().toLowerCase())&&String(item.day||'').toLowerCase()===day);
  for(const item of schedule){
   const [sh,sm]=String(item.start||'').split(':').map(Number),[eh,em]=String(item.end||'').split(':').map(Number);

  }
 };

async function startScheduledTeacherCall(timetableId,automatic=false){
 if(user?.role!=='teacher'||ahrufActiveCall)return;
 const dateKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Dakar',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const key=String(timetableId)+'|'+dateKey;
 window._ahrufAutoCalled=window._ahrufAutoCalled||new Set();
 window._ahrufAutoStarting=window._ahrufAutoStarting||new Set();
 if(automatic&&(window._ahrufAutoCalled.has(key)||window._ahrufAutoStarting.has(key)))return;
 if(automatic)window._ahrufAutoStarting.add(key);
 try{
  const room=automatic?'ahruf-class-'+String(timetableId).replace(/[^a-zA-Z0-9_-]/g,'_')+'-'+dateKey:'ahruf-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
  const result=await onlineApi('authorize_class_call',{timetableId:String(timetableId),room});
  if(result?.status!=='allowed'){if(!automatic)ahrufCallToast(result?.message||'No eligible students are available for this scheduled class.');return}
  const invitees=(result.students||[]).map(x=>String(x.username||'').trim().toLowerCase()).filter(Boolean);
  if(!invitees.length){if(!automatic)ahrufCallToast('No students are eligible for this class call.');return}
  await ahrufCreateCall('video',invitees,{room,timetableId:String(timetableId),automaticClass:automatic});
  if(automatic&&ahrufActiveCall)window._ahrufAutoCalled.add(key);
 }catch(e){console.warn('Scheduled teacher call could not start:',e);if(!automatic)ahrufCallToast(e?.message||'Could not start the scheduled class call.')}
 finally{if(automatic)window._ahrufAutoStarting.delete(key)}
}

  const get=n=>parts.find(p=>p.type===n)?.value||'';
  const day=get('weekday').toLowerCase(),minutes=Number(get('hour'))*60+Number(get('minute'));
  const items=(S.timetable||[]).filter(item=>[user.username,user.id,user.name].some(v=>String(item.teacher||'').trim().toLowerCase()===String(v||'').trim().toLowerCase())&&String(item.day||'').toLowerCase()===day);
  for(const item of items){
   const [sh,sm]=String(item.start||'').split(':').map(Number),[eh,em]=String(item.end||'').split(':').map(Number);
   if(![sh,sm,eh,em].every(Number.isFinite)||minutes<sh*60+sm||minutes>=eh*60+em)continue;

 };

}

async function quranBasmalaText(){
 if(quranSurahCache[1]&&quranSurahCache[1].ayahs&&quranSurahCache[1].ayahs[0])return quranSurahCache[1].ayahs[0].text;
 const response=await fetch('https://api.alquran.cloud/v1/surah/1/quran-uthmani',{headers:{Accept:'application/json'}});
 if(!response.ok)throw new Error('Could not load basmala from source');
 const json=await response.json();
 if(json.code!==200||!json.data||!json.data.ayahs||!json.data.ayahs[0])throw new Error('Invalid basmala source response');
 quranSurahCache[1]=json.data;
 return json.data.ayahs[0].text;
}
async function loadQuranSurah(number){
 number=Math.max(1,Math.min(114,Number(number)||1));
 const target='quranReaderContent',request=++quranRequestId;
 const selector=document.getElementById('quranSurahSelect');if(selector)selector.value=String(number);
 quranLoading(target,t('Loading complete surah…'));
 try{
  let data=quranSurahCache[number];
  if(!data){const response=await fetch('https://api.alquran.cloud/v1/surah/'+number+'/quran-uthmani',{headers:{Accept:'application/json'}});if(!response.ok)throw new Error('HTTP '+response.status);const json=await response.json();if(json.code!==200||!json.data||!Array.isArray(json.data.ayahs)||!json.data.ayahs.length)throw new Error('Invalid Quran response');data=json.data;quranSurahCache[number]=data}
  if(request!==quranRequestId)return;
  const meta=SUR_META[number-1]||{};
  const basmala=number!==1&&number!==9?'<div class="quran-bismillah" lang="ar" dir="rtl">'+esc(await quranBasmalaText())+'</div>':'';
  if(request!==quranRequestId)return;
  const heading='<div class="quran-heading"><div class="quran-ar-title" lang="ar" dir="rtl">'+esc(data.name||meta.arabic||'')+'</div><h3 style="margin:8px 0 4px">'+esc(data.englishName||meta.english||SUR[number-1])+'</h3><div class="mute">'+number+' · '+Number(data.numberOfAyahs||data.ayahs.length)+' '+esc(t('Ayahs'))+' · '+esc(t(data.revelationType||''))+'</div></div>';
  const ayahs=data.ayahs.map(a=>'<span class="quran-ayah" lang="ar" dir="rtl">'+esc(a.text)+' <span class="quran-ayah-mark" aria-label="'+esc(t('Ayah')+' '+a.numberInSurah)+'">'+String(a.numberInSurah)+'</span></span>').join(' ');
  const content=document.getElementById(target);if(content){content.innerHTML=heading+basmala+'<div class="quran-ayahs" lang="ar" dir="rtl">'+ayahs+'</div><div class="quran-source">'+esc(t('Arabic Uthmani text supplied by AlQuran Cloud. The source text is displayed unchanged.'))+' <a href="https://alquran.cloud/api" target="_blank" rel="noopener">AlQuran Cloud API</a> · <a href="https://tanzil.net/docs/Uthmani" target="_blank" rel="noopener">Uthmani script reference</a></div>';applyArabicIndicDigits(content)}
 }catch(e){console.warn('Quran surah load failed',e);if(request===quranRequestId)quranFailure(target)}
}
function safeTajweedHtml(raw){
 const allowed=new Set(['ikhfa','ikhafa','ikhfa_shafawi','idgham_ghunnah','idgham_shafawi','idgham_wo_ghunnah','idgham_no_ghunnah','iqlab','qalqalah','qalaqah','ghunnah','madda_normal','madda_permissible','madda_obligatory','madda_necessary','madda_2','madda_246','madda_obligatory_monfasel','madda_obligatory_mottasel','ham_wasl','laam_shamsiyah','silent','slnt','custom-alef-maksora']);
 const aliases={ikhafa:'ikhfa',qalaqah:'qalqalah',madda_obligatory_monfasel:'madda_obligatory',madda_obligatory_mottasel:'madda_obligatory'};
 const stack=[];
 const source=String(raw||'');
 return source.replace(/<\/?(?:tajweed|rule)\b[^>]*>|[^<]+|</gi,token=>{
  if(token.charAt(0)!=='<')return esc(token);
  if(/^<\/(?:tajweed|rule)\b/i.test(token)){
   const opened=stack.pop();
   return opened?'</span>':'';
  }
  if(/^<(?:tajweed|rule)\b/i.test(token)){
   const match=token.match(/\bclass\s*=\s*["']?([a-z_-]+)["']?/i);
   const cls=match?match[1].toLowerCase():'';
   const safeClass=aliases[cls]||cls;
   const known=allowed.has(cls);
   stack.push(true);
   return '<span'+(known?' class="tj-'+safeClass+'"':'')+'>';
  }
  return '';
 });
}
