<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Ahruf International Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#F6F1E4;--card:#FFFDF8;--ink:#12302B;--mute:#5E756E;--line:#E3DAC4;--pri:#0B4A42;--pri2:#137063;--gold:#C99A3D;--soft:#EEE6D2;--bad:#B3392E;--ok:#1E7A55;--onpri:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081814;--card:#0F2620;--ink:#E6F1ED;--mute:#93AFA6;--line:#21423A;--pri:#1C8A78;--pri2:#2AA48F;--gold:#E0B55B;--soft:#143229;--bad:#F07A6E;--ok:#58C79A}}
:root[data-theme="dark"]{--bg:#081814;--card:#0F2620;--ink:#E6F1ED;--mute:#93AFA6;--line:#21423A;--pri:#1C8A78;--pri2:#2AA48F;--gold:#E0B55B;--soft:#143229;--bad:#F07A6E;--ok:#58C79A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;line-height:1.15}
a{color:inherit}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:10px 20px;background:#0A3A34;color:#fff;border-bottom:3px solid var(--gold)}
.bar img{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold)}
.bar b{font:700 1.25rem 'Cormorant Garamond',serif;letter-spacing:.3px}
.bar .sp{flex:1}.bar small{opacity:.75;display:block;font-size:.72rem}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:5px 12px;font:600 .78rem Figtree;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:var(--onpri);border:0;border-radius:9px;padding:10px 16px;font:700 .88rem Figtree;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pri2)}.btn.gold{background:var(--gold);color:#241a05}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.red{background:var(--bad);color:#fff}.btn.sm{padding:5px 10px;font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-weight:600;font-size:.82rem;margin:12px 0 5px;color:var(--mute)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:stretch}
.brand{background:linear-gradient(160deg,#0A3A34,#0E5A4E);color:#fff;border-radius:18px;padding:34px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--gold)}
.brand img{width:150px;height:150px;border-radius:50%;border:2px solid var(--gold);margin-bottom:18px}
.brand h1{font-size:2.5rem}.brand h1 em{font-style:normal;color:var(--gold)}
.brand p{opacity:.85;max-width:44ch}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--soft);padding:4px;border-radius:11px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:9px;border-radius:8px;font:700 .86rem Figtree;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.12)}
/* Ensure login role selector remains visible and correctly rendered */
#rt{display:flex!important;visibility:visible!important;opacity:1!important}
#rt button{display:block!important;visibility:visible!important;opacity:1!important}

.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(18,48,43,.06)}
.nav button{border:1px solid transparent;background:transparent;color:var(--mute);padding:9px 13px;border-radius:9px;font:700 .84rem Figtree;cursor:pointer;transition:.18s}
.nav button:hover{background:var(--soft);color:var(--pri)}
.nav button.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 7px rgba(11,74,66,.2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stats .card b{font:700 2rem 'Cormorant Garamond',serif;color:var(--pri);display:block}.stats span{color:var(--mute);font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.end{justify-content:flex-end;margin-top:16px}.between{justify-content:space-between}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:.78rem;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}
.badge{padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--soft)}.paid,.present{color:var(--ok)}.pending,.late{color:var(--gold)}.overdue,.absent{color:var(--bad)}
.bar2{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;min-width:80px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold))}
.tag{display:inline-block;background:var(--soft);border-radius:99px;padding:2px 10px;font-size:.76rem;margin:2px}
.code{font:700 1.7rem 'Cormorant Garamond',serif;letter-spacing:4px;color:var(--pri)}
.live{width:10px;height:10px;border-radius:50%;background:#e5484d;display:inline-block;margin-right:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:22px;width:min(520px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;display:none;z-index:99}
.mute{color:var(--mute);font-size:.85rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}.brand h1{font-size:2rem}.bar small{display:none}}

/* Premium Al-Ahruf login styling */
body:has(.hero) .bar{display:none}
body:has(.hero){background:#fbfaf6}
body:has(.hero) .wrap{max-width:none;padding:0}
body:has(.hero) .hero{min-height:100vh;grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);gap:0;background:#fbfaf6}
body:has(.hero) .brand{position:relative;overflow:hidden;border:0;border-radius:0;padding:clamp(38px,6vw,86px);justify-content:center;min-height:100vh;background:radial-gradient(circle at 80% 18%,rgba(201,154,61,.28),transparent 24%),linear-gradient(145deg,#063c34 0%,#0b6659 58%,#0a493f 100%)}
body:has(.hero) .brand:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 28px,rgba(255,255,255,.025) 29px 30px);pointer-events:none}
body:has(.hero) .brand:after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;right:-200px;bottom:-250px;border:1px solid rgba(201,154,61,.35);box-shadow:0 0 0 34px rgba(201,154,61,.05),0 0 0 68px rgba(201,154,61,.035);pointer-events:none}
body:has(.hero) .brand>*{position:relative;z-index:1}
body:has(.hero) .brand img{width:112px;height:112px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.18);margin-bottom:22px}
body:has(.hero) .brand h1{font-size:clamp(3rem,5.2vw,5.2rem);letter-spacing:-1px;max-width:760px}
body:has(.hero) .brand h1 em{display:block;color:#d9aa4d;font-style:italic}
body:has(.hero) .brand p{font-size:clamp(1rem,1.5vw,1.2rem);line-height:1.7;max-width:620px;color:rgba(255,255,255,.86);margin:22px 0 28px}
body:has(.hero) .brand .tabs{background:transparent;padding:0;margin:0;gap:12px}
body:has(.hero) .brand .tabs button{flex:initial;padding:12px 24px;border:1px solid rgba(255,255,255,.7);border-radius:999px;color:#fff;background:transparent}
body:has(.hero) .brand .tabs button:first-child{background:var(--gold);border-color:var(--gold);color:#241a05}
body:has(.hero) .hero>.card{align-self:center;margin:36px;max-width:540px;width:calc(100% - 72px);justify-self:center;background:#fff;border:1px solid #e9e2d4;border-radius:28px;padding:34px;box-shadow:0 22px 70px rgba(20,48,43,.11)}
body:has(.hero) .hero>.card .tabs{display:flex;gap:3px;border:1px solid #d8e1dd;background:#f3f7f5;padding:4px;border-radius:999px;margin-bottom:24px}
body:has(.hero) .hero>.card .tabs button{border:0;background:transparent;color:var(--mute);padding:12px 8px;border-radius:999px;font:700 .9rem Figtree;cursor:pointer}
body:has(.hero) .hero>.card .tabs button.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(11,74,66,.2)}
body:has(.hero) .hero>.card label{font-size:.78rem}
body:has(.hero) .hero>.card input{padding:14px 15px;border-radius:13px;background:#fff;color:#000;border-color:#d8e2de}
body:has(.hero) .hero>.card input::placeholder{color:#555;opacity:1}
body:has(.hero) .hero>.card input:focus{color:#000;background:#fff}
body:has(.hero) .hero>.card input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(19,112,99,.1)}
body:has(.hero) .hero>.card form .btn{width:100%;margin-top:20px;padding:14px;border-radius:13px}
body:has(.hero) .hero>.card .badge{background:transparent;padding:0}
@media(max-width:900px){
 body:has(.hero) .hero{grid-template-columns:1fr}
 body:has(.hero) .brand{min-height:auto;padding:44px 24px 38px}
 body:has(.hero) .brand h1{font-size:3.3rem}
 body:has(.hero) .hero>.card{margin:0;padding:28px 20px;width:100%;max-width:620px;border-radius:0;box-shadow:none}
}
@media(max-width:520px){
 body:has(.hero) .brand{padding:30px 20px}
 body:has(.hero) .brand img{width:82px;height:82px}
 body:has(.hero) .brand h1{font-size:2.55rem}
 body:has(.hero) .brand .tabs{flex-wrap:wrap}
 body:has(.hero) .brand .tabs button{padding:10px 18px}
 body:has(.hero) .hero>.card{padding:22px 16px}
}

.surah-en{font-weight:700}.surah-ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;direction:rtl}.surah-dash{color:var(--mute)}.surah-list-vertical{display:flex;flex-direction:column;gap:8px}.surah-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.surah-num{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--pri);font-weight:700}.surah-item .surah-name{display:flex;align-items:center;gap:6px;flex:1;justify-content:space-between}@media(max-width:560px){.surah-item .surah-name{flex-wrap:wrap;justify-content:flex-start}.surah-ar{font-size:1.12em}}

/* Multilingual interface */
.lang-switch{display:flex;align-items:center;gap:6px;position:fixed;top:62px;left:50%;right:auto;transform:translateX(-50%);z-index:120}
.logout-btn{margin-left:8px;border:1px solid rgba(255,255,255,.45);font-weight:700}.lang-switch select{width:auto;min-width:132px;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(10,58,52,.92);color:#fff;font:600 .78rem Figtree;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.12)}
body.rtl{direction:rtl}
body.rtl .bar,.rtl .row,.rtl .nav,.rtl .tabs{direction:rtl}
body.rtl th{text-align:right}
body.rtl input,body.rtl textarea,body.rtl select{text-align:right}
body.rtl .hero>.card{text-align:right}
body.rtl .brand{text-align:right}
body.rtl .surah-ar{direction:rtl}
body.rtl .lang-switch{right:auto;left:50%;transform:translateX(-50%)}
@media(max-width:520px){.lang-switch{top:58px;left:50%;right:auto;transform:translateX(-50%)}.lang-switch select{min-width:104px}}

/* Password field readability on phones */
body:has(.hero) .hero>.card input[type="password"]{color:#000!important;background:#fff!important;-webkit-text-fill-color:#000!important;caret-color:#000!important;letter-spacing:.04em}
body:has(.hero) .hero>.card input[type="password"]::placeholder{color:#555!important;opacity:1}
@media(max-width:700px){body:has(.hero) .hero>.card input[type="password"]{font-size:16px!important;min-height:48px;padding:14px 15px}}
/* Mobile-first readability and touch layout */
@media(max-width:700px){
  body{font-size:15px;overflow-x:hidden}
  .bar{padding:10px 12px 12px;gap:9px;flex-wrap:wrap;min-height:64px}
  .bar img{width:38px;height:38px;flex:0 0 38px}
  .bar>div:not(.sp){min-width:0}
  .bar b{font-size:1.05rem;line-height:1.15;display:block;white-space:normal}
  .bar small{font-size:.68rem;line-height:1.2}
  .bar .sp{display:none}
  .bar #who{order:5;flex:1 1 100%;text-align:center;font-size:.78rem;margin-top:2px}
  .bar .chip{font-size:.74rem;padding:7px 10px}
  .bar .chip[onclick="theme()"]{margin-left:auto}
  .logout-btn{margin-left:0!important}
  .lang-switch{position:fixed;top:8px;left:auto;right:10px;transform:none;z-index:200}
  .lang-switch select{min-width:96px;padding:7px 9px;font-size:.72rem}
  .wrap{padding:14px 10px 28px}
  .card{padding:14px;border-radius:12px}
  .row{gap:8px}
  .row>*{max-width:100%}
  .nav{gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px;-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto;padding:8px 11px;font-size:.76rem;white-space:nowrap}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stats .card{padding:12px}
  .stats .card b{font-size:1.55rem}
  .grid2{grid-template-columns:1fr;gap:10px}
  .tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:520px;font-size:.82rem}
  th,td{padding:8px}
  .btn{min-height:42px;padding:9px 12px}
  .btn.sm{min-height:36px}
  dialog{width:calc(100vw - 20px);padding:16px;max-height:88vh}
  input,select,textarea{font-size:16px;min-height:44px}
  .surah-item{padding:10px;gap:8px}
  .surah-item .surah-name{min-width:0}
  .code{font-size:1.35rem;letter-spacing:2px}
}
@media(max-width:420px){
  .bar{padding-right:8px;padding-left:8px}
  .bar img{width:34px;height:34px;flex-basis:34px}
  .bar b{font-size:.95rem}
  .bar .chip{padding:6px 8px;font-size:.7rem}
  .lang-switch{right:7px}
  .lang-switch select{min-width:88px;padding:6px 7px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .card b{font-size:1.35rem}
  .end{justify-content:stretch}
  .end .btn{width:100%}
}

/* Keep the login screen clear and comfortable on phones */
@media(max-width:700px){
  body:has(.hero) .hero{min-height:100svh}
  body:has(.hero) .brand{padding:28px 18px 24px;min-height:auto}
  body:has(.hero) .brand img{width:72px;height:72px;margin-bottom:14px}
  body:has(.hero) .brand h1{font-size:clamp(2.15rem,10vw,3rem);line-height:1.05}
  body:has(.hero) .brand p{font-size:.92rem;line-height:1.5;margin:14px 0 18px}
  body:has(.hero) .brand .tabs{gap:7px}
  body:has(.hero) .brand .tabs button{padding:9px 13px;font-size:.78rem}
  body:has(.hero) .hero>.card{padding:20px 16px;width:100%;max-width:none}
  body:has(.hero) .hero>.card .tabs{margin-bottom:18px}
  body:has(.hero) .hero>.card .tabs button{padding:11px 5px;font-size:.8rem}
  body:has(.hero) .hero>.card input{font-size:16px;min-height:48px}
  body:has(.hero) .hero>.card form .btn{min-height:48px}
}

/* Always-visible Admin login */
#rt button[data-r="admin"]{display:block!important;background:var(--gold)!important;color:#241a05!important;border:1px solid var(--gold)!important;font-weight:800!important}

/* Arabic academy name beside the English name */
.arabic-name{display:inline-block;margin-left:10px;font-family:Arial,sans-serif;font-size:.9em;font-weight:700;letter-spacing:0;white-space:nowrap;direction:rtl}
</style>
</head>

const API_BASE=ONLINE?AHRUF_CFG.url.replace(/\/$/,'')+'/functions/v1/academy-api':'';
async function onlineApi(action,payload={}){
  if(!ONLINE||!sb) throw new Error('Online database is not configured yet.');

  // All academy-api calls use POST. Login is performed by the secure Edge Function,
  // which resolves usernames/student IDs to the real Supabase Auth email.
  const body={action,...payload};
  const headers={'Content-Type':'application/json','apikey':AHRUF_CFG.key};

  if(action!=='login'){
    const {data:{session}}=await sb.auth.getSession();
    if(session?.access_token) headers.Authorization='Bearer '+session.access_token;
  }

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  let res;
  try{
    res=await fetch(API_BASE,{method:'POST',headers,body:JSON.stringify(body),signal:controller.signal});
  }catch(e){
    if(e?.name==='AbortError') throw new Error('The academy server did not respond. Please try again.');
    throw e;
  }finally{
    clearTimeout(timeout);
  }
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data?.error) throw new Error(data?.error||('API request failed: '+res.status));

  // The API signs the user in server-side. Install that session in this browser
  // so all subsequent database/API requests are authenticated.
  if(action==='login' && data.session?.access_token && data.session?.refresh_token){
    const {error}=await sb.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });
    if(error) throw error;
  }
  return data;
}

function setLanguage(lang){
 if(!LANGS[lang])return;
 currentLang=lang;localStorage.setItem(LANG_KEY,lang);
 document.documentElement.lang=lang;document.body.classList.toggle('rtl',lang==='ar');
 render();
}
function applyI18n(){
 document.documentElement.lang=currentLang;
 document.body.classList.toggle('rtl',currentLang==='ar');
 const root=document.querySelector('#app');if(!root)return;
 const dict=I18N[currentLang]||{};
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{
   const raw=n.nodeValue, key=raw.trim();
   if(key&&dict[key])n.nodeValue=raw.replace(key,dict[key]);
 });
 root.querySelectorAll('[placeholder]').forEach(el=>{const k=el.getAttribute('placeholder');if(dict[k])el.setAttribute('placeholder',dict[k])});
 root.querySelectorAll('input[type="button"],input[type="submit"],button').forEach(el=>{
   const k=el.textContent.trim();if(dict[k])el.textContent=dict[k];
 });
}

}

async function login(role,u,p){
 u=u.trim();
 if(ONLINE){
   if(onlineBusy)return;
   onlineBusy=true;
   try{
     const d=await onlineApi('login',{role,username:u,password:p});
     if(d.user?.role && d.user.role!==role){
       await sb.auth.signOut();
       throw new Error('Account role does not match the selected login.');
     }
     user=d.user;S=d.state||S;tab=user.role==='student'?'home':'overview';
     toast('Signed in securely');render();
   }catch(e){console.error(e);toast(e.message==='Account role does not match the selected login.'?e.message:'Wrong email or password')}
   finally{onlineBusy=false}
   return;
 }
 if(role==='student'){
   const s=S.students.find(x=>(x.id.toLowerCase()===u.toLowerCase()||x.name.toLowerCase()===u.toLowerCase())&&x.pw===p);
   if(s)user={role:'student',name:s.name,id:s.id};
 }else{
   const a=STAFF[u.toLowerCase()];
   if(a&&a.pw===p&&(role===a.role))user={role:a.role,name:a.name};
 }
 if(!user)return toast('Wrong username or password');tab=user.role==='student'?'home':'overview';render()
}

async function sendPlatformMessage(f){
 const fileInput=f.attachment,file=fileInput?.files?.[0];
 const d={to:f.to.value,subject:'',category:'general',message:f.message.value.trim()};
 if(!d.to&&f.group?.checked)d.to='group:'+String((S.students||[]).find(x=>String(x.id)===String(user.id))?.teacher||'');
 if(!d.to||(!d.message&&!file))return false;
 if(file){
  if(file.size>10*1024*1024){toast('Please choose a file smaller than 10 MB.');return false}
  const reader=new FileReader();
  d.attachment=await new Promise((resolve,reject)=>{reader.onload=()=>resolve({name:file.name,type:file.type||'application/octet-stream',size:file.size,data:reader.result});reader.onerror=()=>reject(new Error('Could not read the selected file.'));reader.readAsDataURL(file)});
 }
 if(ONLINE){const result=await onlineApi('send_message',d);if(result.state){S.messages=result.state.messages||S.messages;S.notifications=result.state.notifications||S.notifications}}
 else{
  const rec=messageRecipients().find(x=>x.u===d.to)||{n:d.to.startsWith('group:')?'Class group':d.to,r:'user'};
  const item={id:String(Date.now()),from:user.id,fromName:user.name,fromRole:user.role,to:d.to,toName:rec.n,toRole:rec.r,subject:'',category:'general',body:d.message,attachment:d.attachment||null,status:'open',createdAt:new Date().toISOString(),readBy:[user.id]};
  S.messages.push(item);save()
 }
 toast('Message sent');render()
}

 : `<tr><td>${esc(s.id)}</td><td><b>${esc(s.name)}</b><br><span class="mute">${esc(s.phone)}</span></td><td>${s.age??'—'}</td><td>${esc(s.sex||'—')}</td><td>${esc(s.level)}</td><td><div class="bar2"><i style="width:${lvl(s)}%"></i></div><span class="mute">${s.sur.length}/114</span></td><td><span class="badge ${s.pay}">${s.pay}</span></td><td><span class="mute">${esc(teacherName(s.teacher))}</span></td><td class="row"><button class="btn ghost sm" onclick="editS('${s.id}')">Edit</button><button class="btn ghost sm" onclick="delS('${s.id}',this)">Delete</button></td></tr>`).join('')||`<tr><td colspan="${teacher?6:9}" class="mute">No students yet.</td></tr>`}
async function delS(id,b){
 if(b.dataset.s){
   if(ONLINE){
     try{const result=await onlineApi('delete_student',{studentId:id});if(result.state)S=result.state;toast('Student deleted online');render()}
     catch(e){toast(e.message||'Delete failed')}
   }else{S.students=S.students.filter(s=>s.id!==id);save();toast('Student deleted');render()}
   return
 }
 b.dataset.s=1;b.textContent='Confirm?';b.classList.add('red')
}
function generateStudentId(name,phone,existingId){
 const keep=String(existingId||'').trim();
 if(keep)return keep;
 const letters=String(name||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase();
 const digits=String(phone||'').replace(/\\D/g,'');
 if(letters.length<2||digits.length<2)return '';
 const base=letters[0]+letters[letters.length-1]+'ARF'+digits.slice(-2);
 const used=new Set((S.students||[]).map(x=>String(x.id||'').toUpperCase()));
 if(!used.has(base))return base;
 let n=2;while(used.has(base+'-'+n))n++;return base+'-'+n;
}
function editS(id){if(user.role!=='admin'){toast('Only the administrator can edit students.');return}const s=S.students.find(x=>x.id===id)||{id:'',name:'',age:'',sex:'',phone:'',email:'',pw:'',level:'Beginner',pay:'pending',sur:[],teacher:''};
 const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 const generated=generateStudentId(s.name,s.phone,id||'');
 modal(id?'Edit student':'Add student',`<label>Full name</label><input name="name" required value="${esc(s.name)}"><div class="row"><div style="flex:1"><label>Student ID</label><input name="id" readonly value="${esc(generated)}" placeholder="Generated automatically"><span class="mute"></span></div><div style="flex:1"><label>Password ${id?'<span class="mute">(leave blank to keep current)</span>':''}</label><input name="pw" ${id?'':'required'} type="password" value="${esc(s.pw||'')}"></div></div><div class="row"><div style="flex:1"><label>Age</label><input name="age" type="number" min="1" max="120" required value="${esc(s.age??'')}"></div><div style="flex:1"><label>Sex</label><select name="sex" required><option value="">Select sex</option><option value="Male" ${s.sex==='Male'?'selected':''}>Male</option><option value="Female" ${s.sex==='Female'?'selected':''}>Female</option></select></div></div><div class="row"><div style="flex:1"><label>Phone</label><input name="phone" required value="${esc(s.phone)}" oninput="this.form.id.value=generateStudentId(this.form.name.value,this.value,'${esc(id||'')}')"></div><div style="flex:1"><label>Email</label><input name="email" type="email" value="${esc(s.email)}"></div></div><div class="row"><div style="flex:1"><label>Level</label><select name="level">${opt(['Beginner','Intermediate','Advanced'],s.level)}</select></div><div style="flex:1"><label>Payment</label><select name="pay">${opt(['paid','pending','overdue'],s.pay)}</select></div></div><label>Teacher</label><select name="teacher">${teacherOptions(s.teacher)}</select><label>Memorized surahs (Ctrl/Cmd + click)</label><select name="sur" multiple size="6">${SUR.map((x,i)=>`<option value="${x}" ${s.sur.includes(x)?'selected':''}>${i+1}. ${surahLabel(x,i)}</option>`).join('')}</select>`,async f=>{
 const nid=f.id.value.trim();
 if(!nid){toast('Enter a full name and a valid phone number to generate the Student ID.');return false}
 if(S.students.some(x=>x.id===nid&&x.id!==id)){toast('That generated ID is already used');return false}
 const age=Number(f.age.value);if(!Number.isInteger(age)||age<1||age>120){toast('Enter a valid age between 1 and 120.');return false}if(!['Male','Female'].includes(f.sex.value)){toast('Select Male or Female.');return false}const d={id:nid,name:f.name.value.trim(),age,sex:f.sex.value,pw:f.pw.value,phone:f.phone.value.trim(),email:f.email.value.trim(),teacher:f.teacher.value.trim(),level:f.level.value,pay:f.pay.value,sur:[...f.sur.selectedOptions].map(o=>o.value)};
 if(ONLINE){
  toast('Saving student...');
  // Do not replace the browser's complete student list with a partial API response.
  // Update only this student locally, then persist the complete list.
  const savedIndex=S.students.findIndex(x=>x.id===nid);
  if(savedIndex>=0){
    S.students[savedIndex]={...S.students[savedIndex],...d};
  }else{
    S.students.push(d);
  }
  await onlineApi('upsert_student',{student:d,existingId:id||null});
  await onlineApi('save_state',{state:S});
}else{const i=S.students.findIndex(x=>x.id===id);i<0?S.students.push(d):S.students[i]=d;save();}
 toast(ONLINE?'Student account created/updated online':'Student saved');render()})}

function attendance(){if(user.role!=='admin'&&user.role!=='teacher')return '<div class="card"><b>Permission denied.</b></div>';const d=new Date().toISOString().slice(0,10);
 return `<div class="card"><div class="row between"><h3>Attendance</h3><input type="date" id="ad" value="${d}" style="max-width:180px" onchange="render()"></div><br><div class="tw"><table><thead><tr><th>Student</th><th>Status</th><th>Memorization</th></tr></thead><tbody>${S.students.map(s=>{const r=(S.att[d]||{})[s.id]||{};return `<tr><td><b>${esc(s.name)}</b></td><td><select id="a-${s.id}"><option value="present" ${r.a==='present'?'selected':''}>Present</option><option value="late" ${r.a==='late'?'selected':''}>Late</option><option value="absent" ${r.a==='absent'?'selected':''}>Absent</option></select></td><td><select id="m-${s.id}"><option value="memorized">Memorized</option><option value="partial" ${r.m==='partial'?'selected':''}>Partial</option><option value="not" ${r.m==='not'?'selected':''}>Not memorized</option></select></td></tr>`}).join('')}</tbody></table></div><div class="row end"><button class="btn" onclick="saveAtt()">Save attendance</button></div></div>`}
function saveAtt(){if(user.role!=='admin'&&user.role!=='teacher')return toast('You do not have permission to edit attendance.');const d=$('#ad').value;S.att[d]={};S.students.forEach(s=>S.att[d][s.id]={a:$('#a-'+s.id).value,m:$('#m-'+s.id).value});save();toast('Attendance saved')}
function invoiceStudent(p){return S.students.find(s=>String(s.id)===String(p.sid))||null}
function viewInvoice(i){const p=S.pay[i];if(!p)return toast('Invoice not found');const s=invoiceStudent(p);if(!s)return toast('Student not found');if(user.role==='student'&&String(s.id)!==String(user.id))return toast('You can only access your own invoice.');
 const w=window.open('','_blank','width=850,height=900');if(!w)return toast('Please allow pop-ups to view the invoice.');
 w.document.write('<!doctype html><html><head><title>'+esc(p.inv||'Invoice')+' - Al-Ahruf International Academy</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.invoice{max-width:760px;margin:40px auto;background:#fff;padding:42px;border:1px solid #ddd;box-shadow:0 8px 30px #0001}.head{display:flex;justify-content:space-between;border-bottom:3px solid #c9a227;padding-bottom:20px}.academy{font-size:24px;font-weight:800}.muted{color:#687386}.title{text-align:center;font-size:28px;margin:30px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.box{border:1px solid #ddd;padding:16px;border-radius:8px}.total{font-size:22px;font-weight:800;text-align:right;margin-top:25px;padding-top:20px;border-top:2px solid #ddd}.status{font-weight:700;text-transform:capitalize}@media print{body{background:#fff}.invoice{box-shadow:none;border:0;margin:0;max-width:none}}</style></head><body><div class="invoice"><div class="head"><div><div class="academy">Al-Ahruf International Academy</div><div class="muted">Nurturing faith, enhancing learning</div></div><div><b>Invoice</b><br>'+esc(p.inv||'')+'</div></div><div class="title">PAYMENT INVOICE</div><div class="grid"><div class="box"><b>Student</b><br>'+esc(s.name||'')+'<br><span class="muted">ID: '+esc(s.id||'')+'</span><br><span class="muted">'+esc(s.email||'')+'</span></div><div class="box"><b>Invoice details</b><br>Invoice date: '+esc(p.date||new Date().toISOString().slice(0,10))+'<br>Due date: '+esc(p.due||'')+'<br>Status: <span class="status">'+esc(p.st||'pending')+'</span></div></div><div class="box"><b>Description</b><br>'+esc(p.description||'Academy tuition')+'</div><div class="total">Amount: $'+esc(p.amt??0)+'</div><p class="muted" style="margin-top:40px">Thank you for being part of Al-Ahruf International Academy.</p></div></body></html>');w.document.close()}
function payments(){if(user.role!=='admin')return '<div class="card"><b>Permission denied.</b></div>';const nm=id=>(S.students.find(s=>s.id===id)||{}).name||id;
 return `<div class="card"><div class="row between"><h3>Payments & Invoices</h3><button class="btn gold" onclick="newInv()">New invoice</button></div><p class="mute">Each invoice belongs to the selected student. It opens as a normal paper-style invoice that can be printed or saved as PDF.</p><br><div class="tw"><table><thead><tr><th>Invoice</th><th>Student</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${S.pay.map((p,i)=>`<tr><td>${esc(p.inv)}</td><td>${esc(nm(p.sid))}</td><td>$${p.amt}</td><td>${esc(p.due)}</td><td><span class="badge ${p.st}">${p.st}</span></td><td><button class="btn ghost sm" onclick="viewInvoice(${i})">Print / Save PDF</button>${p.st!=='paid'?` <button class="btn ghost sm" onclick="markPaid(${i})">Mark paid</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
function markPaid(i){if(user.role!=='admin')return toast('Only the administrator can edit payments.');const p=S.pay[i];p.st='paid';const s=S.students.find(x=>x.id===p.sid);if(s)s.pay='paid';save();toast('Marked as paid');render()}
function newInv(){if(user.role!=='admin')return toast('Only the administrator can create invoices.');if(!S.students.length)return toast('Add a student first');const today=new Date().toISOString().slice(0,10),due=new Date(Date.now()+2592e6).toISOString().slice(0,10);
 modal('New invoice',`<label>Student</label><select name="s">${S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>Amount (USD)</label><input name="a" type="number" min="1" step="0.01" value="50" required><label>Description / Month</label><input name="desc" placeholder="e.g. October 2026 tuition" required><label>Due date</label><input name="d" type="date" required value="${due}">`,f=>{const inv='INV-'+new Date().getFullYear()+String(Date.now()).slice(-6);S.pay.push({inv,sid:f.s.value,amt:+f.a.value,due:f.d.value,date:today,description:f.desc.value.trim(),st:'pending'});save();toast('Invoice created and saved for the selected student');render()},'Create')}
function klass(){
 return `<div class="card"><h3>Start a live class</h3><p class="mute">Each class gets its own private room and code. Students join from any phone or computer. No account needed.</p><form class="row" onsubmit="event.preventDefault();startClass(this.t.value)"><input name="t" placeholder="Class title, e.g. Tajwid, Level 2" required style="flex:1;min-width:220px"><button class="btn">Start class</button></form></div><br>
 <div class="grid2">${S.classes.map((c,i)=>{const inv=base()+'#class='+c.code;return `<div class="card" style="border-color:var(--gold)"><div><span class="live"></span><b>${esc(c.title)}</b></div><div class="code">${c.code}</div><p class="mute" style="word-break:break-all">${esc(inv)}</p><div class="row"><a class="btn gold" target="_blank" rel="noopener" href="${esc(joinUrl(c.code,user.name))}">Open as host</a><button class="btn ghost" onclick="copy('${inv}')">Copy invite</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Join our live class "'+c.title+'" at Al-Ahruf Academy: '+inv)}">WhatsApp</a><button class="btn ghost" onclick="endClass(${i})">End</button></div></div>`}).join('')||'<div class="card mute">No active classes. Start one above.</div>'}</div>
 <p class="mute">Open the room first as host, then share the invite. If Jitsi asks the host to sign in, use a Google account once.</p>`}
function startClass(t){S.classes.unshift({title:t.trim(),code:newCode()});save();toast('Class started');render()}
function endClass(i){S.classes.splice(i,1);save();render()}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Invite copied'),()=>modal('Copy invite link',`<input value="${esc(t)}" readonly onfocus="this.select()">`,()=>{}, 'Done'))}

function viewStudent(){const s=S.students.find(x=>x.id===user.id)||{sur:[],name:''};
 const ranking=[...S.students].sort((a,b)=>b.sur.length-a.sur.length);
 const rank=ranking.findIndex(x=>x.id===s.id)+1;
 const ahead=rank>1?ranking[rank-2]:null;
 const behind=rank<ranking.length?ranking[rank]:null;
 const rankText=rank>0?'#'+rank:'—';
 const gapAhead=ahead?Math.max(0,ahead.sur.length-s.sur.length):0;
 const gapBehind=behind?Math.max(0,s.sur.length-behind.sur.length):0;
 const myInvoices=(S.pay||[]).map((p,i)=>({p,i})).filter(x=>String(x.p.sid)===String(s.id)).reverse();
 return `<h2>As-salamu alaykum, ${esc(s.name)}</h2><br>`+nav([['home','My progress'],['timetable','My Timetable'],['surahs','All surahs'],['myteacher','My Teacher'],['classmates','Classmates'],['messages','Messages'+(unreadCount()?' ('+unreadCount()+')':'')],['join','Live class']])+
 (tab==='messages'?messages():tab==='myteacher'?myTeacher():tab==='classmates'?classmates():tab==='notifications'?notifications():tab==='timetable'?timetable():tab==='join'?`<div class="card"><h3>Join your class</h3><p class="mute">Paste the code or invite link from your teacher.</p><form onsubmit="event.preventDefault();doJoin2(this)"><input name="c" required placeholder="Class code or invite link"><br><br><button class="btn">Continue</button></form>${joinInfo?`<br><a class="btn gold" target="_blank" rel="noopener" href="${esc(joinUrl(joinInfo.c,s.name))}">Enter classroom</a>`:''}</div>`
 :tab==='surahs'?`<div class="card"><h3>All 114 Surahs</h3><p class="mute">${s.sur.length} of 114 memorized</p><br><div class="surah-list-vertical">${SUR.map((x,i)=>`<div class="surah-item"><span class="surah-num">${i+1}</span><div class="surah-name">${surahLabel(x,i)}${s.sur.includes(x)?'<span class="badge paid">✓ Memorized</span>':''}</div></div>`).join('')}</div></div>`
 :`<div class="stats"><div class="card"><b>${s.sur.length}</b><span>Surahs memorized</span></div><div class="card"><b>${lvl(s)}%</b><span>Of the Quran</span></div><div class="card"><b>${rankText}</b><span>Your ranking</span></div><div class="card"><b class="badge ${s.pay}" style="font-size:1rem;display:inline-block;margin-bottom:6px">${s.pay}</b><span style="display:block">Payment</span></div></div>
<div class="card" style="border-color:var(--gold);margin-bottom:14px"><h3>Your Memorization Ranking</h3><p class="mute">Keep memorizing to move higher in the ranking.</p><br>
${ahead?'<div class="row between"><span>⬆️ <b>Ahead of you</b></span><span>'+esc(ahead.name)+' — '+ahead.sur.length+' surahs</span></div><div class="mute" style="margin-top:4px">'+gapAhead+' more surah'+(gapAhead===1?'':'s')+' to reach this position.</div>':rank===1?'<div class="row"><span>🏆 <b>You are #1 — the current top memorizer!</b></span></div>':'<div class="mute">Your ranking will appear as soon as students are added.</div>'}
${behind?'<div class="row between" style="margin-top:14px"><span>⬇️ <b>Behind you</b></span><span>'+esc(behind.name)+' — '+behind.sur.length+' surahs</span></div><div class="mute" style="margin-top:4px">'+gapBehind+' more surah'+(gapBehind===1?'':'s')+' than the student behind you.</div>':'<div class="mute" style="margin-top:14px">No student is currently behind you.</div>'}
</div><div class="card"><h3>Your progress</h3><br><div class="bar2" style="height:14px"><i style="width:${lvl(s)}%"></i></div><br>${s.sur.map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="mute">Your memorized surahs will appear here.</span>'}</div><br><div class="card"><h3>My invoices</h3><p class="mute">Invoices issued to you are available here. Only your own invoices are shown.</p><br>${myInvoices.length?myInvoices.map(x=>{const p=x.p;return `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p.inv||'Invoice')}</b><br><span class="mute">${esc(p.description||'Academy tuition')} · Due ${esc(p.due||'')}</span><br><span class="badge ${esc(p.st||'pending')}">$${p.amt??0} · ${esc(p.st||'pending')}</span></div><button class="btn gold sm" onclick="viewInvoice(${x.i})">Print / Save PDF</button></div>`}).join(''):'<span class="mute">No invoices have been issued to you yet.</span>'}</div>`)}
function doJoin2(f){joinInfo={n:user.name,c:parseCode(f.c.value)};render()}
function safeLoginFallback(err){
 const a=document.getElementById('app'); if(!a)return;
 a.innerHTML=`<div class="hero"><div class="brand"><h1>Al-Ahruf Academy</h1><p>Nurturing faith, enhancing learning</p></div><div class="card"><h2>Welcome</h2><p class="mute">Please choose how you want to continue.</p><div class="row"><button class="btn" onclick="lt='in';render()">Log in</button><button class="btn ghost" onclick="lt='join';render()">Join a class</button></div></div></div>`;
 console.error('Al-Ahruf render error:',err);
}
async function startApp(){
 // Render the login screen immediately. Never make the whole interface wait for Supabase.
 try{render()}catch(e){safeLoginFallback(e)}
 if(ONLINE){
   try{
     const sessionPromise=loadOnlineState();
     const timeout=new Promise(resolve=>setTimeout(()=>resolve(false),5000));
     const restored=await Promise.race([sessionPromise,timeout]);
     if(restored)render();
   }catch(e){console.warn('Startup session load skipped:',e)}
 }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startApp,{once:true});else startApp();
</script>
