<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Ahruf International Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#F6F1E4;--card:#FFFDF8;--ink:#12302B;--mute:#5E756E;--line:#E3DAC4;--pri:#0B4A42;--pri2:#137063;--gold:#C99A3D;--soft:#EEE6D2;--bad:#B3392E;--ok:#1E7A55;--onpri:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081814;--card:#0F2620;--ink:#E6F1ED;--mute:#93AFA6;--line:#21423A;--pri:#1C8A78;--pri2:#2AA48F;--gold:#E0B55B;--soft:#143229;--bad:#F07A6E;--ok:#58C79A}}
:root[data-theme="dark"]{--bg:#081814;--card:#0F2620;--ink:#E6F1ED;--mute:#93AFA6;--line:#21423A;--pri:#1C8A78;--pri2:#2AA48F;--gold:#E0B55B;--soft:#143229;--bad:#F07A6E;--ok:#58C79A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;line-height:1.15}
a{color:inherit}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#0A3A34;color:#fff;border-bottom:3px solid var(--gold)}
.bar img{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold)}
.bar b{font:700 1.25rem 'Cormorant Garamond',serif;letter-spacing:.3px}
.bar .sp{flex:1}.bar small{opacity:.75;display:block;font-size:.72rem}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:5px 12px;font:600 .78rem Figtree;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:var(--onpri);border:0;border-radius:9px;padding:10px 16px;font:700 .88rem Figtree;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--pri2)}.btn.gold{background:var(--gold);color:#241a05}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.red{background:var(--bad);color:#fff}.btn.sm{padding:5px 10px;font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-weight:600;font-size:.82rem;margin:12px 0 5px;color:var(--mute)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:stretch}
.brand{background:linear-gradient(160deg,#0A3A34,#0E5A4E);color:#fff;border-radius:18px;padding:34px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--gold)}
.brand img{width:150px;height:150px;border-radius:50%;border:2px solid var(--gold);margin-bottom:18px}
.brand h1{font-size:2.5rem}.brand h1 em{font-style:normal;color:var(--gold)}
.brand p{opacity:.85;max-width:44ch}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--soft);padding:4px;border-radius:11px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:9px;border-radius:8px;font:700 .86rem Figtree;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.nav button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:700 .84rem Figtree;cursor:pointer}
.nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stats .card b{font:700 2rem 'Cormorant Garamond',serif;color:var(--pri);display:block}.stats span{color:var(--mute);font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.end{justify-content:flex-end;margin-top:16px}.between{justify-content:space-between}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:.78rem;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}
.badge{padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--soft)}.paid,.present{color:var(--ok)}.pending,.late{color:var(--gold)}.overdue,.absent{color:var(--bad)}
.bar2{height:9px;background:var(--soft);border-radius:9px;overflow:hidden;min-width:80px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold))}
.tag{display:inline-block;background:var(--soft);border-radius:99px;padding:2px 10px;font-size:.76rem;margin:2px}
.code{font:700 1.7rem 'Cormorant Garamond',serif;letter-spacing:4px;color:var(--pri)}
.live{width:10px;height:10px;border-radius:50%;background:#e5484d;display:inline-block;margin-right:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:22px;width:min(520px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;display:none;z-index:99}
.mute{color:var(--mute);font-size:.85rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}.brand h1{font-size:2rem}.bar small{display:none}}
</style>
</head>

 <form onsubmit="event.preventDefault();doJoin(this)"><label>Your name</label><input name="n" required autocomplete="name"><label>Class code or invite link</label><input name="c" required value="${esc(pre)}" placeholder="e.g. K7M2QX9P"><div style="margin-top:16px"><button class="btn" style="width:100%">Continue</button></div></form>
 ${joinInfo?`<div class="card" style="margin-top:16px;border-color:var(--gold)"><b>You're ready, ${esc(joinInfo.n)}.</b><p class="mute">Allow camera and microphone when your browser asks.</p><a class="btn gold" style="width:100%" target="_blank" rel="noopener" href="${esc(joinUrl(joinInfo.c,joinInfo.n))}">Enter classroom</a></div>`:''}`
 :`<div class="tabs" id="rt"><button class="on" data-r="student">Student</button><button data-r="teacher">Teacher</button><button data-r="admin">Admin</button></div>
 <form onsubmit="event.preventDefault();login(window._r||'student',this.u.value,this.p.value)"><label>Username or student ID</label><input name="u" required autocomplete="username"><label>Password</label><input name="p" type="password" required autocomplete="current-password"><div style="margin-top:16px"><button class="btn" style="width:100%">Sign in</button></div></form>`}
 <p class="mute" style="margin-top:16px">Emergency line: <b>+221 774 482 293</b></p></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('#rt button');if(!b)return;window._r=b.dataset.r;document.querySelectorAll('#rt button').forEach(x=>x.classList.toggle('on',x===b))});
function doJoin(f){const c=parseCode(f.c.value);if(c.length<4)return toast('Check the class code');joinInfo={n:f.n.value.trim(),c};render();$('#app').scrollIntoView()}

function nav(items){return `<div class="nav">${items.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>`}
function viewStaff(){
 const admin=user.role==='admin';
 return `<div class="row between"><h2>Welcome, ${esc(user.name)}</h2><span class="badge">${admin?'Administrator':'Teacher'}</span></div><br>`+nav([['overview','Overview'],['students','Students'],['attendance','Attendance'],['payments','Payments'],['class','Live class']])+({overview,students,attendance,payments,klass})[tab==='class'?'klass':tab]()}
function overview(){
 const n=S.students.length,avg=n?S.students.reduce((a,s)=>a+lvl(s),0)/n:0,rev=S.pay.filter(p=>p.st==='paid').reduce((a,p)=>a+p.amt,0),due=S.pay.filter(p=>p.st!=='paid').length;
 const top=[...S.students].sort((a,b)=>b.sur.length-a.sur.length).slice(0,5);
 return `<div class="stats"><div class="card"><b>${n}</b><span>Students</span></div><div class="card"><b>${avg.toFixed(1)}%</b><span>Average Qur'an progress</span></div><div class="card"><b>$${rev}</b><span>Collected</span></div><div class="card"><b>${due}</b><span>Unpaid invoices</span></div></div>
 <div class="card"><h3>Top memorizers</h3><br>${top.map((s,i)=>`<div class="row between" style="margin-bottom:8px"><span>${i+1}. ${esc(s.name)}</span><span class="mute">${s.sur.length} surahs</span></div><div class="bar2"><i style="width:${lvl(s)}%"></i></div>`).join('')||'<p class="mute">Add your first student to see rankings.</p>'}</div>`}
function students(){return `<div class="row between" style="margin-bottom:12px"><input id="q" placeholder="Search students" oninput="rows()" style="max-width:300px"><button class="btn" onclick="editS()">Add student</button></div><div class="card tw"><table><thead><tr><th>ID</th><th>Name</th><th>Level</th><th>Progress</th><th>Payment</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`+(setTimeout(rows),'')}
function rows(){const q=($('#q')?.value||'').toLowerCase(),tb=$('#tb');if(!tb)return;
 tb.innerHTML=S.students.filter(s=>(s.name+s.id).toLowerCase().includes(q)).map(s=>`<tr><td>${esc(s.id)}</td><td><b>${esc(s.name)}</b><br><span class="mute">${esc(s.phone)}</span></td><td>${esc(s.level)}</td><td><div class="bar2"><i style="width:${lvl(s)}%"></i></div><span class="mute">${s.sur.length}/114</span></td><td><span class="badge ${s.pay}">${s.pay}</span></td><td class="row"><button class="btn ghost sm" onclick="editS('${s.id}')">Edit</button>${user.role==='admin'?`<button class="btn ghost sm" onclick="delS('${s.id}',this)">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="mute">No students yet.</td></tr>'}
function delS(id,b){if(b.dataset.s){S.students=S.students.filter(s=>s.id!==id);save();toast('Student deleted');return render()}b.dataset.s=1;b.textContent='Confirm?';b.classList.add('red')}
function editS(id){const s=S.students.find(x=>x.id===id)||{id:'ST'+String(S.students.length+1).padStart(3,'0'),name:'',phone:'',email:'',pw:'',level:'Beginner',pay:'pending',sur:[]};
 const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 modal(id?'Edit student':'Add student',`<label>Full name</label><input name="name" required value="${esc(s.name)}"><div class="row"><div style="flex:1"><label>Student ID</label><input name="id" required value="${esc(s.id)}"></div><div style="flex:1"><label>Password</label><input name="pw" required value="${esc(s.pw)}"></div></div><div class="row"><div style="flex:1"><label>Phone</label><input name="phone" value="${esc(s.phone)}"></div><div style="flex:1"><label>Email</label><input name="email" type="email" value="${esc(s.email)}"></div></div><div class="row"><div style="flex:1"><label>Level</label><select name="level">${opt(['Beginner','Intermediate','Advanced'],s.level)}</select></div><div style="flex:1"><label>Payment</label><select name="pay">${opt(['paid','pending','overdue'],s.pay)}</select></div></div><label>Memorized surahs (Ctrl/Cmd + click)</label><select name="sur" multiple size="6">${SUR.map((x,i)=>`<option value="${x}" ${s.sur.includes(x)?'selected':''}>${i+1}. ${x}</option>`).join('')}</select>`,f=>{
 const nid=f.id.value.trim();if(S.students.some(x=>x.id===nid&&x.id!==id)){toast('That ID is already used');return false}
 const d={id:nid,name:f.name.value.trim(),pw:f.pw.value,phone:f.phone.value.trim(),email:f.email.value.trim(),level:f.level.value,pay:f.pay.value,sur:[...f.sur.selectedOptions].map(o=>o.value)};
 const i=S.students.findIndex(x=>x.id===id);i<0?S.students.push(d):S.students[i]=d;save();toast('Student saved');render()})}
function attendance(){const d=new Date().toISOString().slice(0,10);
 return `<div class="card"><div class="row between"><h3>Attendance</h3><input type="date" id="ad" value="${d}" style="max-width:180px" onchange="render()"></div><br><div class="tw"><table><thead><tr><th>Student</th><th>Status</th><th>Memorization</th></tr></thead><tbody>${S.students.map(s=>{const r=(S.att[d]||{})[s.id]||{};return `<tr><td><b>${esc(s.name)}</b></td><td><select id="a-${s.id}"><option value="present" ${r.a==='present'?'selected':''}>Present</option><option value="late" ${r.a==='late'?'selected':''}>Late</option><option value="absent" ${r.a==='absent'?'selected':''}>Absent</option></select></td><td><select id="m-${s.id}"><option value="memorized">Memorized</option><option value="partial" ${r.m==='partial'?'selected':''}>Partial</option><option value="not" ${r.m==='not'?'selected':''}>Not memorized</option></select></td></tr>`}).join('')}</tbody></table></div><div class="row end"><button class="btn" onclick="saveAtt()">Save attendance</button></div></div>`}
function saveAtt(){const d=$('#ad').value;S.att[d]={};S.students.forEach(s=>S.att[d][s.id]={a:$('#a-'+s.id).value,m:$('#m-'+s.id).value});save();toast('Attendance saved')}
function payments(){const nm=id=>(S.students.find(s=>s.id===id)||{}).name||id;
 return `<div class="card"><div class="row between"><h3>Payments</h3><button class="btn gold" onclick="newInv()">New invoice</button></div><br><div class="tw"><table><thead><tr><th>Invoice</th><th>Student</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${S.pay.map((p,i)=>`<tr><td>${esc(p.inv)}</td><td>${esc(nm(p.sid))}</td><td>$${p.amt}</td><td>${esc(p.due)}</td><td><span class="badge ${p.st}">${p.st}</span></td><td>${p.st!=='paid'?`<button class="btn ghost sm" onclick="markPaid(${i})">Mark paid</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
function markPaid(i){const p=S.pay[i];p.st='paid';const s=S.students.find(x=>x.id===p.sid);if(s)s.pay='paid';save();toast('Marked as paid');render()}
function newInv(){if(!S.students.length)return toast('Add a student first');modal('New invoice',`<label>Student</label><select name="s">${S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>Amount (USD)</label><input name="a" type="number" min="1" value="50"><label>Due date</label><input name="d" type="date" required value="${new Date(Date.now()+2592e6).toISOString().slice(0,10)}">`,f=>{S.pay.push({inv:'INV-'+String(Date.now()).slice(-5),sid:f.s.value,amt:+f.a.value,due:f.d.value,st:'pending'});save();toast('Invoice created');render()},'Create')}
function klass(){
 return `<div class="card"><h3>Start a live class</h3><p class="mute">Each class gets its own private room and code. Students join from any phone or computer. No account needed.</p><form class="row" onsubmit="event.preventDefault();startClass(this.t.value)"><input name="t" placeholder="Class title, e.g. Tajwid, Level 2" required style="flex:1;min-width:220px"><button class="btn">Start class</button></form></div><br>
 <div class="grid2">${S.classes.map((c,i)=>{const inv=base()+'#class='+c.code;return `<div class="card" style="border-color:var(--gold)"><div><span class="live"></span><b>${esc(c.title)}</b></div><div class="code">${c.code}</div><p class="mute" style="word-break:break-all">${esc(inv)}</p><div class="row"><a class="btn gold" target="_blank" rel="noopener" href="${esc(joinUrl(c.code,user.name))}">Open as host</a><button class="btn ghost" onclick="copy('${inv}')">Copy invite</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Join our live class "'+c.title+'" at Al-Ahruf Academy: '+inv)}">WhatsApp</a><button class="btn ghost" onclick="endClass(${i})">End</button></div></div>`}).join('')||'<div class="card mute">No active classes. Start one above.</div>'}</div>
 <p class="mute">Open the room first as host, then share the invite. If Jitsi asks the host to sign in, use a Google account once.</p>`}
function startClass(t){S.classes.unshift({title:t.trim(),code:newCode()});save();toast('Class started');render()}
function endClass(i){S.classes.splice(i,1);save();render()}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Invite copied'),()=>modal('Copy invite link',`<input value="${esc(t)}" readonly onfocus="this.select()">`,()=>{}, 'Done'))}

function viewStudent(){const s=S.students.find(x=>x.id===user.id)||{sur:[],name:''};
 const rank=[...S.students].sort((a,b)=>b.sur.length-a.sur.length).findIndex(x=>x.id===s.id)+1;
 return `<h2>As-salamu alaykum, ${esc(s.name)}</h2><br>`+nav([['home','My progress'],['surahs','All surahs'],['join','Live class']])+
 (tab==='join'?`<div class="card"><h3>Join your class</h3><p class="mute">Paste the code or invite link from your teacher.</p><form onsubmit="event.preventDefault();doJoin2(this)"><input name="c" required placeholder="Class code or invite link"><br><br><button class="btn">Continue</button></form>${joinInfo?`<br><a class="btn gold" target="_blank" rel="noopener" href="${esc(joinUrl(joinInfo.c,s.name))}">Enter classroom</a>`:''}</div>`
 :tab==='surahs'?`<div class="card"><h3>${s.sur.length} of 114 memorized</h3><br>${SUR.map((x,i)=>`<span class="tag" style="${s.sur.includes(x)?'background:var(--pri);color:#fff':''}">${i+1}. ${x}</span>`).join('')}</div>`
 :`<div class="stats"><div class="card"><b>${s.sur.length}</b><span>Surahs memorized</span></div><div class="card"><b>${lvl(s)}%</b><span>Of the Qur'an</span></div><div class="card"><b>#${rank}</b><span>Class ranking</span></div><div class="card"><b class="badge ${s.pay}" style="font-size:1rem;display:inline-block;margin-bottom:6px">${s.pay}</b><span style="display:block">Payment</span></div></div><div class="card"><h3>Your progress</h3><br><div class="bar2" style="height:14px"><i style="width:${lvl(s)}%"></i></div><br>${s.sur.map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="mute">Your memorized surahs will appear here.</span>'}</div>`)}
function doJoin2(f){joinInfo={n:user.name,c:parseCode(f.c.value)};render()}
render();
</script>
</body>
</html>
