name: Deploy Al-Ahruf Academy API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/academy-api/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-academy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy academy-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub repository secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          supabase functions deploy academy-api --project-ref bxwrdutoauonbfdbrhsu --no-verify-jwt
